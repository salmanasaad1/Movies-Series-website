{% extends 'base2.html' %}
{% block conte %}

<header class="container">
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <div class="alert alert-success">
              <strong>{{message}}</strong> 
            </div>
        {% endfor %}
    </ul>
    {% endif %}
    <div class="nav">
        <a href="{% url 'sign-up' %}" class="btn btn-rounded">Sign up</a>
    </div>
    <div class="content">
        <h1>Unlimited movies, TV shows and more.</h1>
        <p>Ready to watch? Sign in and Enjoy.</p>
        <form method="POST" enctype="multipart/form-data" class="inp" action=''>
            {% csrf_token %}
            <input class="inp" type="text" name="username" id="username" placeholder="Username" required>

            <input class="inp" type="password" name="pass1" id="pass1" placeholder="Password" required>
        <input type="submit"  value="Login" class="btn btn-rounded btn-s" />
        </form>
        

    </div>


</header>

{% endblock conte %}
