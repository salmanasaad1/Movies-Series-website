{% extends 'base2.html' %}
{% load static %}
{% block conte %}
<header class="container">
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <div class="alert alert-success">
              <strong>{{message}}</strong> 
            </div>
        {% endfor %}
    </ul>
    {% endif %}
    <div class="nav">
        
        <a href="{% url 'login' %}" class="btn btn-rounded">Sign In</a>
    </div>
    <div class="content">
        <h1>Unlimited movies, TV shows and more.</h1>
        <p>Ready to watch? Sign up and Enjoy.</p>
        <form method="POST" enctype="multipart/form-data" class="inp" action=''>
            {% csrf_token %}
            <input class="inp" type="text" name="username" id="username" placeholder="Username" required>
            <input class="inp" type="email" name="email" id="email" placeholder="Email address" required>
            <input class="inp" type="Password" name="pass1" id="pass1" placeholder="Password">
        <input type="submit"  value="Sign up" class="btn btn-rounded btn-s" />
        </form>
        
    </div>
</header>
{% endblock conte %}
